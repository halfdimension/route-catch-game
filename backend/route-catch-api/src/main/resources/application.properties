spring.application.name=route-catch-api
spring.datasource.url=jdbc:postgresql://localhost:5432/route_catch_game
spring.datasource.username=route_catch_user
spring.datasource.password=route_catch_pass
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
osrm.base-url=http://localhost:5000
multiplayer.movement.osrm.connect-timeout=2s
multiplayer.movement.osrm.read-timeout=10s
multiplayer.movement.initial-latitude=28.550584664849566
multiplayer.movement.initial-longitude=77.26885829983426
# Dev-only JWT defaults. Override these in non-local environments.
auth.jwt.secret=route-catch-dev-secret-change-me-route-catch-dev-secret-change-me
auth.jwt.expiration=24h
