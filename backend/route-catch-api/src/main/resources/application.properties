spring.application.name=route-catch-api
spring.datasource.url=jdbc:postgresql://localhost:5432/route_catch_game
spring.datasource.username=route_catch_user
spring.datasource.password=route_catch_pass
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
osrm.base-url=http://localhost:5000
multiplayer.movement.osrm.connect-timeout=2s
multiplayer.movement.osrm.read-timeout=10s
multiplayer.movement.initial-latitude=28.550584664849566
multiplayer.movement.initial-longitude=77.26885829983426
multiplayer.creatures.auto-spawn.enabled=true
multiplayer.creatures.auto-spawn.interval=5s
multiplayer.creatures.auto-spawn.base-active-count=4
multiplayer.creatures.auto-spawn.per-player-active-count=2
multiplayer.creatures.auto-spawn.max-active-count=30
multiplayer.creatures.auto-spawn.max-spawns-per-cycle=5
multiplayer.creatures.auto-spawn.min-radius-meters=150
multiplayer.creatures.auto-spawn.max-radius-meters=1200
multiplayer.creatures.auto-spawn.min-creature-separation-meters=100
multiplayer.creatures.auto-spawn.max-placement-attempts=8
multiplayer.creatures.auto-spawn.creature-ttl=2m
# Dev-only JWT defaults. Override these in non-local environments.
auth.jwt.secret=route-catch-dev-secret-change-me-route-catch-dev-secret-change-me
auth.jwt.expiration=24h
