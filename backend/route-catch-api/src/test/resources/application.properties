spring.datasource.url=jdbc:h2:mem:route_catch_game;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
osrm.base-url=http://localhost:5000
multiplayer.creatures.auto-spawn.enabled=false
multiplayer.creatures.auto-spawn.interval=5s
multiplayer.creatures.auto-spawn.base-active-count=4
multiplayer.creatures.auto-spawn.per-player-active-count=2
multiplayer.creatures.auto-spawn.max-active-count=30
multiplayer.creatures.auto-spawn.max-spawns-per-cycle=5
multiplayer.creatures.auto-spawn.min-radius-meters=150
multiplayer.creatures.auto-spawn.max-radius-meters=1200
multiplayer.creatures.auto-spawn.min-creature-separation-meters=100
multiplayer.creatures.auto-spawn.max-placement-attempts=8
multiplayer.creatures.auto-spawn.creature-ttl=2m
